<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stock Predictor</title>
    <style>
      body { width: 340px; margin: 0; padding: 12px; background: #f8f9fa; }
      h1 { font: 600 14px -apple-system, BlinkMacSystemFont, sans-serif; margin: 0 0 10px; }
      #settings { font: 12px -apple-system, BlinkMacSystemFont, sans-serif; margin-top: 12px; color: #3e4c59; }
      #settings input { width: 100%; box-sizing: border-box; margin: 6px 0; padding: 4px 6px; }
      #status { font-size: 11px; color: #616e7c; }
    </style>
  </head>
  <body>
    <h1>Next-day forecast</h1>
    <div id="app"></div>
    <details id="settings">
      <summary>Server settings</summary>
      <label for="server">Prediction server URL</label>
      <input id="server" type="url" placeholder="http://127.0.0.1:8080" />
      <button id="save" type="button">Save &amp; test</button>
      <span id="status"></span>
    </details>
    <script src="render.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
